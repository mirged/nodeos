[workspace]
resolver = "2"
members = ["libnode", "libdraw", "init", "console", "compositor", "shell", "doom", "audio", "fs", "sysinfo", "tree", "bench", "edit", "cc"]

[workspace.dependencies]
nodeos-abi = { path = "../abi" }
libnode = { path = "libnode" }
libdraw = { path = "libdraw" }

[profile.release]
panic = "abort"
opt-level = 2
debug = true
codegen-units = 1
overflow-checks = true

[profile.dev]
panic = "abort"
opt-level = 1
debug = true
