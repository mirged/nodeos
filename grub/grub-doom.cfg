set timeout=0
set default=0

# Doom and the shell, side by side, as two clients of one compositor.
#
# This file used to say the opposite: Doom held the framebuffer and the PS/2
# keyboard itself, so `console` and `shell` could not be loaded alongside it --
# there was one screen and one keyboard, and the boot configuration had to
# decide who got them. `compositor` holds both now, and hands each client a
# window and a channel instead, so the choice is gone.
#
# Cycle the keyboard focus between the two windows with the Meta ("Windows")
# key, or Scroll Lock where the VM swallows Meta.
#
# `init` is not started here: nothing in this boot needs to load a further
# image, and giving the boot the smallest set of processes that does the job is
# the point of a launcher policy.
menuentry "NodeOS (doom)" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug
    module2 /boot/compositor.nxf compositor
    module2 /boot/audio.nxf audio
    module2 /boot/fs.nxf fs
    module2 /boot/console.nxf console
    module2 /boot/shell.nxf shell
    module2 /boot/doom.nxf doom
    module2 /boot/doom.wad doom.wad
    boot
}
