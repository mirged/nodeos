set timeout=0
set default=0

# The default entry runs userspace to completion and powers the machine off with
# a status, which is what `make test` (and `make run`/`make debug`) reads.
# `grub-graphic.cfg` has the same two entries but defaults to "resident"
# instead, for `make run-graphic`/`make debug-graphic` where you actually want
# the window system running in the QEMU window.
menuentry "NodeOS (autotest)" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug nodeos.autotest
    module2 /boot/init.nxf init
    boot
}

# `compositor` holds the framebuffer and the keyboard; `console` and `shell`
# are its clients. The launcher starts them in dependency order regardless of
# the order they are listed here -- see `launch_rank` in kernel/src/launch.rs.
menuentry "NodeOS (resident)" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug
    module2 /boot/init.nxf init
    module2 /boot/compositor.nxf compositor
    module2 /boot/audio.nxf audio
    module2 /boot/fs.nxf fs
    module2 /boot/console.nxf console
    module2 /boot/shell.nxf shell
    boot
}
