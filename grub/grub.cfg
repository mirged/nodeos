set timeout=5
set timeout_style=menu
# Boot the window system by default. The second entry is the headless
# self-test boot used by `make test`; it lives in the image too so there is only
# one ISO to build.
set default=0

# compositor holds the screen and the keyboard; console and shell are its
# clients, and everything else the shell launches -- including Doom, with
# `run /bin/doom.nxf` -- is a child of the shell. The launcher starts services
# in dependency order regardless of the order they are listed here; see
# `launch_rank` in kernel/src/launch.rs.
menuentry "NodeOS" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug
    module2 /boot/init.nxf init
    module2 /boot/compositor.nxf compositor
    module2 /boot/audio.nxf audio
    module2 /boot/fs.nxf fs
    module2 /boot/console.nxf console
    module2 /boot/shell.nxf shell
    boot
}

menuentry "NodeOS (self-test)" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug nodeos.autotest
    module2 /boot/init.nxf init
    boot
}
