set timeout=0
# The headless self-test boot: only `init`, and the kernel powers the machine
# off with a status when userspace finishes. `make test` reads that status.
set default=0

menuentry "NodeOS (self-test)" {
    multiboot2 /boot/nodeos-kernel nodeos.loglevel=debug nodeos.autotest
    module2 /boot/init.nxf init
    boot
}
